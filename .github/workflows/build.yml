name: macOS build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Test routing
        run: swift test
      - name: Build universal app
        run: bash scripts/build-app.sh --arch arm64 --arch x86_64
      - name: Verify macOS URL event delivery
        run: python3 scripts/test-url-events.py
      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent 'dist/Profile Router.app' dist/ProfileRouter.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ProfileRouter-macOS
          path: dist/ProfileRouter.zip
